name: Rust backend feasibility
on:
  push:
    branches: [feat/rust-language]
  pull_request:
    paths:
      - test/rust-backend.test.ts
      - .github/workflows/rust-backend.yml
      - docs/rust-adapter.md
permissions:
  contents: read
concurrency:
  group: rust-backend-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  semantic-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Install the pinned optional experimental backend
        run: rustup toolchain install 1.85.0 --profile minimal --component rust-analyzer --component rust-src
      - name: Exercise semantic queries and native Rust dispatch
        env:
          BONSAI_RUST_PROBE: '1'
        run: bun test --isolate --timeout 180000 test/rust-backend.test.ts
