name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
# Keep the strict root test in a fresh process; distribute other slow files
# across the existing ARM64 runners without adding queue demand.
env:
  BONSAI_ARM_SECONDARY_TESTS: >-
    test/cli.test.ts
    test/check-presentation.test.ts
    test/cli-output.test.ts
    test/native-cli.test.ts
    test/check-timing.test.ts
    test/cli-base-paths.test.ts
jobs:
  format:
    if: >-
      (github.event_name == 'push' && github.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run format
      - run: bun run sync-skills
      - name: Export formatting and reference patch
        id: patch
        run: |
          git add --all -- skills/bonsai/reference
          if ! git diff HEAD --quiet; then
            mkdir -p "$RUNNER_TEMP/format-patch"
            git diff HEAD --binary > "$RUNNER_TEMP/format-patch/format.patch"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.patch.outputs.changed == 'true'
        with:
          name: format-patch
          path: ${{ runner.temp }}/format-patch/format.patch
          retention-days: 1

  apply-formatting:
    needs: format
    if: needs.format.outputs.changed == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: format-patch
          path: ${{ runner.temp }}/format-patch
      # This job only applies data and runs Git. Never run package scripts,
      # install dependencies, or execute files from the candidate checkout here.
      - name: Commit formatting and reference patch
        id: commit
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config core.hooksPath /dev/null
          git apply --index "$RUNNER_TEMP/format-patch/format.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Push and PR runs produce the same commit when formatting the same head.
          export GIT_AUTHOR_DATE="$(git show -s --format=%cI HEAD)"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          git commit -m 'chore: sync skill references and formatting'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  python-contract:
    needs: [format, apply-formatting]
    if: >-
      always() && !cancelled() &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.apply-formatting.result == 'success' || needs.apply-formatting.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include formatting commit in validation
        if: needs.apply-formatting.outputs.sha != ''
        env:
          FORMATTED_SHA: ${{ needs.apply-formatting.outputs.sha }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$FORMATTED_SHA"
          git merge --no-edit "$FORMATTED_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - name: Verify Python project adoption through the real CLI
        run: bun run test:specs -- --scenario "Python team"
      - name: Verify native Python analysis and runtime boundaries
        if: always()
        run: bun test --isolate --timeout 30000 test/python-language.test.ts

  python-arm:
    needs: [format, apply-formatting]
    if: >-
      always() && !cancelled() &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.apply-formatting.result == 'success' || needs.apply-formatting.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include formatting commit in validation
        if: needs.apply-formatting.outputs.sha != ''
        env:
          FORMATTED_SHA: ${{ needs.apply-formatting.outputs.sha }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$FORMATTED_SHA"
          git merge --no-edit "$FORMATTED_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - name: Verify Python and secondary contracts on ARM64
        env:
          RAYON_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          read -r -a secondary <<< "$BONSAI_ARM_SECONDARY_TESTS"
          for file in test/python-language.test.ts "${secondary[@]}"; do
            test -f "$file" || { echo "::error::Missing required ARM test file: $file"; exit 1; }
          done
          bun test --isolate --timeout 30000 test/python-language.test.ts "${secondary[@]}"

  integration-contracts:
    needs: [format, apply-formatting]
    if: >-
      always() && !cancelled() &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.apply-formatting.result == 'success' || needs.apply-formatting.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include formatting commit in validation
        if: needs.apply-formatting.outputs.sha != ''
        env:
          FORMATTED_SHA: ${{ needs.apply-formatting.outputs.sha }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$FORMATTED_SHA"
          git merge --no-edit "$FORMATTED_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify publisher requirements and selected routes through the real CLI
        run: bun run test:specs -- --scenario features/integrations.feature

  jig-adapter:
    needs: [format, apply-formatting]
    if: >-
      always() && !cancelled() &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.apply-formatting.result == 'success' || needs.apply-formatting.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include formatting commit in validation
        if: needs.apply-formatting.outputs.sha != ''
        env:
          FORMATTED_SHA: ${{ needs.apply-formatting.outputs.sha }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$FORMATTED_SHA"
          git merge --no-edit "$FORMATTED_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check out the pinned official Jig host provisioner
        uses: actions/checkout@v4
        with:
          repository: jiggy/jig
          ref: 57c71520f9adf784c6ce85f904878013b7176806
          path: .bonsai/jig-host
          persist-credentials: false
      - name: Select the exact CI Bun executable
        run: |
          test "$(uname -m)" = x86_64
          JIG_CI_BUN="$(readlink -f "$(command -v bun)")"
          test -x "$JIG_CI_BUN"
          printf 'JIG_CI_BUN=%s\n' "$JIG_CI_BUN" >> "$GITHUB_ENV"
      - name: Provision the qualified rootless Linux host
        id: jig_host
        run: .bonsai/jig-host/scripts/ci/provision-github-rootless-host.sh provision
      - name: Verify the installed Jig route and current approved source
        run: |
          .bonsai/jig-host/scripts/ci/provision-github-rootless-host.sh run-acquisition-host \
            /usr/bin/env BONSAI_JIG_SMOKE=1 "$JIG_CI_BUN" test --isolate \
            --timeout 300000 test/jig-real.test.ts
      - name: Require Jig host cleanup after success or failure
        if: always() && steps.jig_host.outcome != '' && steps.jig_host.outcome != 'skipped'
        run: .bonsai/jig-host/scripts/ci/provision-github-rootless-host.sh assert-clean

  verify-tests:
    needs: [format, apply-formatting]
    if: >-
      always() && !cancelled() &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.apply-formatting.result == 'success' || needs.apply-formatting.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include formatting commit in validation
        if: needs.apply-formatting.outputs.sha != ''
        env:
          FORMATTED_SHA: ${{ needs.apply-formatting.outputs.sha }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$FORMATTED_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check:skills
      - run: bun run check
      - name: Install pinned Rust for the complete authored contracts
        run: rustup toolchain install 1.86.0 --profile minimal --component rust-analyzer --component rust-src
      - name: Verify ordinary unit and CLI regressions
        id: regressions
        env:
          RAYON_NUM_THREADS: '1'
        run: |
          # Every ordinary test file is assigned exactly once. The complete
          # root runs below in a fresh process, preserving its 15s deadline.
          set -euo pipefail
          read -r -a secondary <<< "$BONSAI_ARM_SECONDARY_TESTS"
          declare -A excluded=()
          for file in test/python-language.test.ts test/self-host.test.ts "${secondary[@]}"; do
            test -f "$file" || { echo "::error::Missing required ARM test file: $file"; exit 1; }
            if [[ -n "${excluded[$file]+x}" ]]; then
              echo "::error::Duplicate ARM test assignment: $file"
              exit 1
            fi
            excluded["$file"]=1
          done
          mapfile -d '' all_tests < <(find test -type f -name '*.test.ts' -print0 | sort -z)
          tests=()
          for file in "${all_tests[@]}"; do
            if [[ -z "${excluded[$file]+x}" ]]; then tests+=("$file"); fi
          done
          test "${#tests[@]}" -gt 0
          echo "ARM primary: ${#tests[@]} files; secondary: ${#secondary[@]} plus Python; root: 1"
          bun test --isolate --timeout 30000 "${tests[@]}"
      - name: Verify the production package with a fresh cache
        if: ${{ !cancelled() }}
        run: bun run test:package
      - run: bun run demo

  self-host:
    name: Complete-root verification
    needs: [format, apply-formatting]
    if: >-
      always() && !cancelled() &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.apply-formatting.result == 'success' || needs.apply-formatting.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include formatting commit in validation
        if: needs.apply-formatting.outputs.sha != ''
        env:
          FORMATTED_SHA: ${{ needs.apply-formatting.outputs.sha }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$FORMATTED_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - name: Install pinned Rust for the complete authored contracts
        run: rustup toolchain install 1.86.0 --profile minimal --component rust-analyzer --component rust-src
      - name: Qualify and warm the native source backend on this runner
        run: bun test --isolate --timeout 30000 test/tsrs-collector.test.ts
      - name: Verify full-root feedback in a fresh test process
        if: ${{ !cancelled() && steps.regressions.outcome != 'skipped' }}
        env:
          BONSAI_SELF_CHECK_REPORT: ${{ runner.temp }}/bonsai-self-check.json
          BONSAI_SPEC_TRACE: ${{ runner.temp }}/bonsai-spec-timings.jsonl
          # Scenario lanes already parallelize native checks on the reference CPUs.
          RAYON_NUM_THREADS: '1'
        run: bun test --isolate --timeout 30000 test/self-host.test.ts
      - name: Summarize nested specification command timings
        if: always()
        env:
          BONSAI_SPEC_TRACE: ${{ runner.temp }}/bonsai-spec-timings.jsonl
        run: |
          bun -e '
            const file = Bun.file(process.env.BONSAI_SPEC_TRACE);
            if (await file.exists()) {
              const rows = (await file.text()).trim().split("\n").map(JSON.parse);
              const finished = new Set(rows.filter(row => row.elapsedMs !== undefined).map(row => `${row.pid}:${row.started}`));
              console.log(JSON.stringify({slowest: rows.filter(row => row.elapsedMs !== undefined).sort((a, b) => b.elapsedMs - a.elapsedMs).slice(0, 15), unfinished: rows.filter(row => row.elapsedMs === undefined && !finished.has(`${row.pid}:${row.started}`))}));
            }'

      - name: Summarize actual root verdict and timings
        if: always()
        env:
          BONSAI_SELF_CHECK_REPORT: ${{ runner.temp }}/bonsai-self-check.json
        run: |
          bun -e '
            const path = process.env.BONSAI_SELF_CHECK_REPORT;
            if (path && await Bun.file(path).exists()) {
              const report = await Bun.file(path).json();
              const snapshot = report.snapshot;
              console.log(JSON.stringify({
                decision: report.decision ?? null,
                observations: snapshot?.contracts?.checks?.length ?? null,
                passed: snapshot?.evidence?.checks?.filter(c => c.status === "passed").length ?? null,
                complete: snapshot?.evidence?.complete ?? null,
                unrooted: snapshot?.unrooted?.length ?? null,
                sourceProblems: snapshot?.source?.problems ?? null,
                timing: snapshot?.timing ?? null
              }));
            }'
      - name: Save full-root self-check evidence and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-self-check
          path: ${{ runner.temp }}/bonsai-self-check.json
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: verify
    needs: [verify-tests, self-host]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both ordinary and complete-root evidence
        env:
          ORDINARY_RESULT: ${{ needs.verify-tests.result }}
          ROOT_RESULT: ${{ needs.self-host.result }}
        run: |
          test "$ORDINARY_RESULT" = success
          test "$ROOT_RESULT" = success

  native-platforms:
    name: Native recovery (${{ matrix.platform }})
    needs: [format, apply-formatting]
    if: >-
      always() && !cancelled() &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.apply-formatting.result == 'success' || needs.apply-formatting.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include formatting commit in validation
        if: needs.apply-formatting.outputs.sha != ''
        env:
          FORMATTED_SHA: ${{ needs.apply-formatting.outputs.sha }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$FORMATTED_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Assert the actual runtime platform
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: test "$(bun -p 'process.platform + "-" + process.arch')" = "$EXPECTED_PLATFORM"
      - name: Check out the compiler matching the pinned tsrs dependency
        if: matrix.platform == 'darwin-x64'
        uses: actions/checkout@v4
        with:
          repository: oxc-project/tsrs
          ref: 5f92808bc92bb97b06212153ab73d28d551c0b9b # v0.18.0
          path: .bonsai/tsrs
          persist-credentials: false
      # A restored Cargo target cache still rebuilt tsrs for 7m04s. Cache the
      # exact pinned executable instead; native regressions always run afresh.
      - name: Identify Intel compiler toolchain
        if: matrix.platform == 'darwin-x64'
        id: intel-toolchain
        run: |
          rustc -Vv
          release="$(rustc -Vv | awk '$1 == "release:" { print $2 }')"
          test -n "$release"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Restore pinned Intel executable
        if: matrix.platform == 'darwin-x64'
        id: intel-executable
        uses: actions/cache/restore@v4
        with:
          path: .bonsai/tsrs/target/ci/tsrs
          key: bonsai-tsrs-executable-v1-macos15-intel-5f92808bc92bb97b06212153ab73d28d551c0b9b-ts7.1.0-dev.20260930.4-${{ steps.intel-toolchain.outputs.release }}-${{ hashFiles('.bonsai/tsrs/Cargo.lock') }}
      - name: Build the matching Intel macOS API server
        if: matrix.platform == 'darwin-x64' && steps.intel-executable.outputs.cache-hit != 'true'
        working-directory: .bonsai/tsrs
        env:
          TSRS_TS_VERSION: 7.1.0-dev.20260930.4
        run: cargo build --locked --profile ci -p tsrs_cli --bin tsrs
      - name: Verify pinned Intel executable
        if: matrix.platform == 'darwin-x64'
        run: |
          test -x .bonsai/tsrs/target/ci/tsrs
          file .bonsai/tsrs/target/ci/tsrs
          shasum -a 256 .bonsai/tsrs/target/ci/tsrs
      - name: Save pinned Intel executable after a cold build
        if: matrix.platform == 'darwin-x64' && steps.intel-executable.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .bonsai/tsrs/target/ci/tsrs
          key: bonsai-tsrs-executable-v1-macos15-intel-5f92808bc92bb97b06212153ab73d28d551c0b9b-ts7.1.0-dev.20260930.4-${{ steps.intel-toolchain.outputs.release }}-${{ hashFiles('.bonsai/tsrs/Cargo.lock') }}
      - name: Test native installation and Git root aliases
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$NATIVE_PLATFORM" = darwin-x64 ]; then
            export BONSAI_NATIVE_BINARY="$PWD/.bonsai/tsrs/target/ci/tsrs"
          else
            export BONSAI_NATIVE_BINARY="$(bun -e "import getExePath from './node_modules/tsrs/lib/getExePath.js'; console.log(getExePath())")"
          fi
          test -x "$BONSAI_NATIVE_BINARY"
          bun test --isolate --timeout 30000 test/native-installation.test.ts test/cli-base-paths.test.ts

  runner-adapters:
    needs: [format, apply-formatting]
    if: >-
      always() && !cancelled() &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.apply-formatting.result == 'success' || needs.apply-formatting.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include formatting commit in validation
        if: needs.apply-formatting.outputs.sha != ''
        env:
          FORMATTED_SHA: ${{ needs.apply-formatting.outputs.sha }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$FORMATTED_SHA"
          git merge --no-edit "$FORMATTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:runners

  report-browser:
    needs: [format, apply-formatting]
    if: >-
      always() && !cancelled() &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.apply-formatting.result == 'success' || needs.apply-formatting.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BONSAI_BROWSER_QA: '1'
      BONSAI_BROWSER_PREVIEWS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include formatting commit in validation
        if: needs.apply-formatting.outputs.sha != ''
        env:
          FORMATTED_SHA: ${{ needs.apply-formatting.outputs.sha }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$FORMATTED_SHA"
          git merge --no-edit "$FORMATTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Set temporary browser paths
        run: |
          printf 'BONSAI_BROWSER_TOOLING=%s\n' "$RUNNER_TEMP/bonsai-browser-tooling" >> "$GITHUB_ENV"
          printf 'BONSAI_BROWSER_ARTIFACTS=%s\n' "$RUNNER_TEMP/bonsai-report-browser" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/bonsai-chromium" >> "$GITHUB_ENV"
      - name: Install isolated pinned browser tooling
        run: |
          mkdir -p "$BONSAI_BROWSER_TOOLING"
          printf '%s\n' '{"private":true}' > "$BONSAI_BROWSER_TOOLING/package.json"
          bun add --cwd "$BONSAI_BROWSER_TOOLING" --exact --ignore-scripts playwright@1.64.1
          bun "$BONSAI_BROWSER_TOOLING/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check generated HTML in Chromium
        run: bun test --isolate --timeout 180000 test/report-browser.test.ts
      - name: Save browser captures and actual check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-report-browser
          path: ${{ runner.temp }}/bonsai-report-browser
          if-no-files-found: ignore
          retention-days: 14

  report-formatting-check:
    needs: [apply-formatting, verify, python-contract, python-arm, native-platforms, runner-adapters, report-browser, integration-contracts, jig-adapter]
    if: always() && needs.apply-formatting.outputs.sha != ''
    permissions:
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No candidate checkout or candidate commands in this write-capable job.
      - name: Report validation on formatting commit
        env:
          GH_TOKEN: ${{ github.token }}
          FORMATTED_SHA: ${{ needs.apply-formatting.outputs.sha }}
          RESULT: ${{ needs.verify.result }}
          PYTHON_ARM_RESULT: ${{ needs.python-arm.result }}
          PYTHON_X64_RESULT: ${{ needs.python-contract.result }}
          NATIVE_RESULT: ${{ needs.native-platforms.result }}
          RUNNER_RESULT: ${{ needs.runner-adapters.result }}
          BROWSER_RESULT: ${{ needs.report-browser.result }}
          INTEGRATION_RESULT: ${{ needs.integration-contracts.result }}
          JIG_RESULT: ${{ needs.jig-adapter.result }}
        run: |
          conclusion="$RESULT"
          if [ "$conclusion" = success ] && [ "$PYTHON_X64_RESULT" != success ]; then
            conclusion="$PYTHON_X64_RESULT"
          fi
          if [ "$conclusion" = success ] && [ "$PYTHON_ARM_RESULT" != success ]; then
            conclusion="$PYTHON_ARM_RESULT"
          fi
          if [ "$conclusion" = success ] && [ "$NATIVE_RESULT" != success ]; then
            conclusion="$NATIVE_RESULT"
          fi
          if [ "$conclusion" = success ] && [ "$RUNNER_RESULT" != success ]; then
            conclusion="$RUNNER_RESULT"
          fi
          if [ "$conclusion" = success ] && [ "$BROWSER_RESULT" != success ]; then
            conclusion="$BROWSER_RESULT"
          fi
          if [ "$conclusion" = success ] && [ "$INTEGRATION_RESULT" != success ]; then
            conclusion="$INTEGRATION_RESULT"
          fi
          if [ "$conclusion" = success ] && [ "$JIG_RESULT" != success ]; then
            conclusion="$JIG_RESULT"
          fi
          # GitHub job states are not all valid Checks API conclusions.
          case "$conclusion" in
            success|failure|cancelled|timed_out|action_required|neutral) ;;
            *) echo "Unsuccessful or unknown required job result: $conclusion" >&2; conclusion=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=verify -f head_sha="$FORMATTED_SHA" \
            -f status=completed -f conclusion="$conclusion" \
            -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

