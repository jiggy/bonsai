name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  format:
    if: >-
      (github.event_name == 'push' && github.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run format
      - name: Export formatting patch
        id: patch
        run: |
          if ! git diff --quiet; then
            mkdir -p "$RUNNER_TEMP/format-patch"
            git diff --binary > "$RUNNER_TEMP/format-patch/format.patch"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.patch.outputs.changed == 'true'
        with:
          name: format-patch
          path: ${{ runner.temp }}/format-patch/format.patch
          retention-days: 1

  apply-formatting:
    needs: format
    if: needs.format.outputs.changed == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: format-patch
          path: ${{ runner.temp }}/format-patch
      # This job only applies data and runs Git. Never run package scripts,
      # install dependencies, or execute files from the candidate checkout here.
      - name: Commit formatting patch
        id: commit
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config core.hooksPath /dev/null
          git apply --index "$RUNNER_TEMP/format-patch/format.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Push and PR runs produce the same commit when formatting the same head.
          export GIT_AUTHOR_DATE="$(git show -s --format=%cI HEAD)"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          git commit -m 'style: apply formatting'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: [format, apply-formatting]
    if: >-
      always() && !cancelled() &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.apply-formatting.result == 'success' || needs.apply-formatting.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include formatting commit in validation
        if: needs.apply-formatting.outputs.sha != ''
        env:
          FORMATTED_SHA: ${{ needs.apply-formatting.outputs.sha }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$FORMATTED_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check
      - run: bun run native:compare
      - name: Verify unit, CLI, and executable feature contracts
        env:
          BONSAI_SELF_CHECK_REPORT: ${{ runner.temp }}/bonsai-self-check.json
        run: bun run test
      - name: Summarize actual root verdict and timings
        if: always()
        env:
          BONSAI_SELF_CHECK_REPORT: ${{ runner.temp }}/bonsai-self-check.json
        run: |
          bun -e '
            const path = process.env.BONSAI_SELF_CHECK_REPORT;
            if (path && await Bun.file(path).exists()) {
              const report = await Bun.file(path).json();
              const snapshot = report.snapshot;
              console.log(JSON.stringify({
                decision: report.decision ?? null,
                observations: snapshot?.contracts?.checks?.length ?? null,
                passed: snapshot?.evidence?.checks?.filter(c => c.status === "passed").length ?? null,
                complete: snapshot?.evidence?.complete ?? null,
                unrooted: snapshot?.unrooted?.length ?? null,
                sourceProblems: snapshot?.source?.problems ?? null,
                timing: snapshot?.timing ?? null
              }));
            }'
      - name: Save full-root self-check evidence and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-self-check
          path: ${{ runner.temp }}/bonsai-self-check.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify the production package with a fresh cache
        run: bun run test:package
      - run: bun run demo

  native-platforms:
    name: Native recovery (${{ matrix.platform }})
    needs: [format, apply-formatting]
    if: >-
      always() && !cancelled() &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.apply-formatting.result == 'success' || needs.apply-formatting.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include formatting commit in validation
        if: needs.apply-formatting.outputs.sha != ''
        env:
          FORMATTED_SHA: ${{ needs.apply-formatting.outputs.sha }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$FORMATTED_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Assert the actual runtime platform
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: test "$(bun -p 'process.platform + "-" + process.arch')" = "$EXPECTED_PLATFORM"
      - name: Check out the compiler matching the pinned tsrs dependency
        if: matrix.platform == 'darwin-x64'
        uses: actions/checkout@v4
        with:
          repository: oxc-project/tsrs
          ref: 5f92808bc92bb97b06212153ab73d28d551c0b9b # v0.18.0
          path: .bonsai/tsrs
          persist-credentials: false
      - name: Build the matching Intel macOS API server
        if: matrix.platform == 'darwin-x64'
        working-directory: .bonsai/tsrs
        env:
          TSRS_TS_VERSION: 7.1.0-dev.20260930.4
        run: cargo build --locked --profile ci -p tsrs_cli --bin tsrs
      - name: Test native installation and Git root aliases
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$NATIVE_PLATFORM" = darwin-x64 ]; then
            export BONSAI_NATIVE_BINARY="$PWD/.bonsai/tsrs/target/ci/tsrs"
          else
            export BONSAI_NATIVE_BINARY="$(bun -e "import getExePath from './node_modules/tsrs/lib/getExePath.js'; console.log(getExePath())")"
          fi
          test -x "$BONSAI_NATIVE_BINARY"
          bun test --isolate --timeout 30000 test/native-installation.test.ts test/cli-base-paths.test.ts

  runner-adapters:
    needs: [format, apply-formatting]
    if: >-
      always() && !cancelled() &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.apply-formatting.result == 'success' || needs.apply-formatting.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include formatting commit in validation
        if: needs.apply-formatting.outputs.sha != ''
        env:
          FORMATTED_SHA: ${{ needs.apply-formatting.outputs.sha }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$FORMATTED_SHA"
          git merge --no-edit "$FORMATTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run test:runners

  report-browser:
    needs: [format, apply-formatting]
    if: >-
      always() && !cancelled() &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.apply-formatting.result == 'success' || needs.apply-formatting.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BONSAI_BROWSER_QA: '1'
      BONSAI_BROWSER_PREVIEWS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include formatting commit in validation
        if: needs.apply-formatting.outputs.sha != ''
        env:
          FORMATTED_SHA: ${{ needs.apply-formatting.outputs.sha }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$FORMATTED_SHA"
          git merge --no-edit "$FORMATTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Set temporary browser paths
        run: |
          printf 'BONSAI_BROWSER_TOOLING=%s\n' "$RUNNER_TEMP/bonsai-browser-tooling" >> "$GITHUB_ENV"
          printf 'BONSAI_BROWSER_ARTIFACTS=%s\n' "$RUNNER_TEMP/bonsai-report-browser" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/bonsai-chromium" >> "$GITHUB_ENV"
      - name: Install isolated pinned browser tooling
        run: |
          mkdir -p "$BONSAI_BROWSER_TOOLING"
          printf '%s\n' '{"private":true}' > "$BONSAI_BROWSER_TOOLING/package.json"
          bun add --cwd "$BONSAI_BROWSER_TOOLING" --exact --ignore-scripts playwright@1.64.1
          bun "$BONSAI_BROWSER_TOOLING/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check generated HTML in Chromium
        run: bun test --isolate --timeout 180000 test/report-browser.test.ts
      - name: Save browser captures and actual check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-report-browser
          path: ${{ runner.temp }}/bonsai-report-browser
          if-no-files-found: ignore
          retention-days: 14

  report-formatting-check:
    needs: [apply-formatting, verify, native-platforms, runner-adapters, report-browser]
    if: always() && needs.apply-formatting.outputs.sha != ''
    permissions:
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No candidate checkout or candidate commands in this write-capable job.
      - name: Report validation on formatting commit
        env:
          GH_TOKEN: ${{ github.token }}
          FORMATTED_SHA: ${{ needs.apply-formatting.outputs.sha }}
          RESULT: ${{ needs.verify.result }}
          NATIVE_RESULT: ${{ needs.native-platforms.result }}
          RUNNER_RESULT: ${{ needs.runner-adapters.result }}
          BROWSER_RESULT: ${{ needs.report-browser.result }}
        run: |
          conclusion="$RESULT"
          if [ "$conclusion" = success ] && [ "$NATIVE_RESULT" != success ]; then
            conclusion="$NATIVE_RESULT"
          fi
          if [ "$conclusion" = success ] && [ "$RUNNER_RESULT" != success ]; then
            conclusion="$RUNNER_RESULT"
          fi
          if [ "$conclusion" = success ] && [ "$BROWSER_RESULT" != success ]; then
            conclusion="$BROWSER_RESULT"
          fi
          if [ "$conclusion" = skipped ]; then
            conclusion=failure
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=verify -f head_sha="$FORMATTED_SHA" \
            -f status=completed -f conclusion="$conclusion" \
            -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
